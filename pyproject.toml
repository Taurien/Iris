[project]
name = "iris"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=21",
    "python-dotenv>=1.0",
    "faster-whisper",
    "numpy",
    "piper-tts",
    "sounddevice",
    "soundfile",
    "aiohttp",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iris"]
